name: Release

# Run manually: Actions tab -> Release -> Run workflow.
# Publishes a GitHub release for the version in package.json, with the zip
# the in-app updater and install.sh download.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (leave blank to auto-generate from commits)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for the release notes

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ steps.v.outputs.version }} is already released. Bump the version in package.json first."
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=zpa-shield-deployer/ -o "zpa-shield-deployer-v${{ steps.v.outputs.version }}.zip" HEAD

      - name: Write release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          # Notes typed into "Run workflow" win; otherwise list the commits since the last release
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}HEAD
            git log "$RANGE" --no-merges --format='- %s' \
              | grep -viE '^- (chore: bump version|Update release\.yml)' > notes.md || true
            [ -s notes.md ] || echo "- Maintenance release" > notes.md
          fi
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
            "zpa-shield-deployer-$TAG.zip" install.sh install.bat
